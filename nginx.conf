server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: resuelve los servicios en cada peticion, asi nginx
  # arranca aunque un servicio todavia no este listo (antes salia "host not found").
  resolver 127.0.0.11 valid=10s;

  location /api/auth       { set $up http://auth-service:8081;     proxy_pass $up; }
  location /api/categorias { set $up http://catalogo-service:8082; proxy_pass $up; }
  location /api/productos  { set $up http://catalogo-service:8082; proxy_pass $up; }
  location /api/clientes   { set $up http://ventas-service:8083;   proxy_pass $up; }
  location /api/ventas     { set $up http://ventas-service:8083;   proxy_pass $up; }
  location /api/alertas    { set $up http://alertas-service:8084;  proxy_pass $up; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
